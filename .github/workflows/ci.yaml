name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements_test.txt ruff==0.17.3
      - name: Lint
        run: ruff check custom_components tests
      - name: Test
        run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@1.0.0

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@22.5.0
        with:
          category: integration
